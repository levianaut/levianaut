[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
# Identity
version = "0.0.1"
# Toolchain
edition = "2024"
rust-version = "1.97"
# Project
description = "A free, open-source and modern video media server"
readme = "README.md"
homepage = "https://levianaut.org"
repository = "https://github.com/levianaut/levianaut"
# Legal
license = "AGPL-3.0-or-later"

[workspace.dependencies]
levianaut-server = { path = "crates/levianaut-server" }

anyhow = "1"
# Pin unreleased header-read timeout and connection-limit support
# until an Axum release includes them.
axum = {
    git = "https://github.com/tokio-rs/axum",
    rev = "8b30afbfeee457146d29c9c9db47f0ae621a22a8",
}
clap = "4"
thiserror = "2"
tokio = "1"
tower = "0.5"
tower-http = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
