[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
# Identity
version = "0.0.1"
# Toolchain
edition = "2024"
rust-version = "1.97"
# Project
description = "A free, open-source and modern video media server"
readme = "README.md"
homepage = "https://levianaut.org"
repository = "https://github.com/levianaut/levianaut"
# Legal
license = "AGPL-3.0-or-later"

[workspace.dependencies]
levianaut-server = { path = "crates/levianaut-server" }

axum = "0.8"
clap = "4"
tokio = "1"
tower = "0.5"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
